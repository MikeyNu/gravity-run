name: CI

on:
  push:
    branches: [main, agent/complete-game]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Python asset toolchain
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-assets.txt

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile=false

      - name: Install asset-authoring dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-assets.txt

      - name: Generate and audit runtime assets
        run: pnpm assets:generate

      - name: Validate production checkpoints
        run: python tools/validate_production_checkpoints.py --repo .

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Validate asset manifest
        run: pnpm validate:assets

      - name: Build
        run: pnpm build
